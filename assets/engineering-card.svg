<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="red-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff4b4b" />
    </linearGradient>

    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>

    <linearGradient id="purple-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .card-title { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
      .bullet { font-size: 12px; font-weight: 500; fill: #8b949e; }
      .bullet-strong { fill: #c9d1d9; font-weight: 600; }
    </style>
  </defs>

  <!-- Main Background Container -->
  <rect x="2" y="2" width="916" height="216" rx="14" fill="#090d13" stroke="#30363d" stroke-width="1.2" />

  <!-- Column 1: Core Architecture -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="272" height="176" rx="10" fill="url(#card-bg)" stroke="#30363d" stroke-width="1" />
    <rect x="16" y="16" width="32" height="4" rx="2" fill="url(#red-accent)" />
    <text x="16" y="42" class="mono card-title" fill="#ffffff">SYSTEMS ARCHITECTURE</text>
    <text x="16" y="58" class="sans" font-size="11" fill="#ff4b4b">Clean • Scalable • Fast</text>

    <g transform="translate(16, 82)">
      <circle cx="3" cy="-3" r="2.5" fill="#ff3366" />
      <text x="12" y="0" class="sans bullet"><tspan class="bullet-strong">60 FPS Native Graphics</tspan> (Skia)</text>

      <circle cx="3" cy="22" r="2.5" fill="#ff3366" />
      <text x="12" y="25" class="sans bullet"><tspan class="bullet-strong">Deterministic State</tspan> Engines</text>

      <circle cx="3" cy="47" r="2.5" fill="#ff3366" />
      <text x="12" y="50" class="sans bullet"><tspan class="bullet-strong">Offline-First</tspan> Architecture</text>

      <circle cx="3" cy="72" r="2.5" fill="#ff3366" />
      <text x="12" y="75" class="sans bullet"><tspan class="bullet-strong">Zero-Bloat</tspan> Bundle Optimization</text>
    </g>
  </g>

  <!-- Column 2: AI & Agentic Systems -->
  <g transform="translate(324, 20)">
    <rect x="0" y="0" width="272" height="176" rx="10" fill="url(#card-bg)" stroke="#30363d" stroke-width="1" />
    <rect x="16" y="16" width="32" height="4" rx="2" fill="url(#cyan-accent)" />
    <text x="16" y="42" class="mono card-title" fill="#ffffff">AI &amp; AUTONOMOUS AGENTS</text>
    <text x="16" y="58" class="sans" font-size="11" fill="#00d2ff">Model Context Protocol • Tool Use</text>

    <g transform="translate(16, 82)">
      <circle cx="3" cy="-3" r="2.5" fill="#00d2ff" />
      <text x="12" y="0" class="sans bullet"><tspan class="bullet-strong">Production MCP</tspan> Servers &amp; Tools</text>

      <circle cx="3" cy="22" r="2.5" fill="#00d2ff" />
      <text x="12" y="25" class="sans bullet"><tspan class="bullet-strong">Self-Healing</tspan> IT Runbooks</text>

      <circle cx="3" cy="47" r="2.5" fill="#00d2ff" />
      <text x="12" y="50" class="sans bullet"><tspan class="bullet-strong">Multi-Agent</tspan> Orchestration</text>

      <circle cx="3" cy="72" r="2.5" fill="#00d2ff" />
      <text x="12" y="75" class="sans bullet"><tspan class="bullet-strong">Computer Vision</tspan> (Pose Estimation)</text>
    </g>
  </g>

  <!-- Column 3: Full-Stack Execution -->
  <g transform="translate(624, 20)">
    <rect x="0" y="0" width="272" height="176" rx="10" fill="url(#card-bg)" stroke="#30363d" stroke-width="1" />
    <rect x="16" y="16" width="32" height="4" rx="2" fill="url(#purple-accent)" />
    <text x="16" y="42" class="mono card-title" fill="#ffffff">SCALE &amp; EXECUTION</text>
    <text x="16" y="58" class="sans" font-size="11" fill="#a78bfa">Cloud • Mobile • Full-Stack</text>

    <g transform="translate(16, 82)">
      <circle cx="3" cy="-3" r="2.5" fill="#a78bfa" />
      <text x="12" y="0" class="sans bullet"><tspan class="bullet-strong">Cross-Platform</tspan> (iOS, Android, Web)</text>

      <circle cx="3" cy="22" r="2.5" fill="#a78bfa" />
      <text x="12" y="25" class="sans bullet"><tspan class="bullet-strong">Cloud Native</tspan> (Azure, Firebase, Docker)</text>

      <circle cx="3" cy="47" r="2.5" fill="#a78bfa" />
      <text x="12" y="50" class="sans bullet"><tspan class="bullet-strong">Real-Time Sync</tspan> &amp; Analytics</text>

      <circle cx="3" cy="72" r="2.5" fill="#a78bfa" />
      <text x="12" y="75" class="sans bullet"><tspan class="bullet-strong">Automated CI/CD</tspan> &amp; Sysadmin</text>
    </g>
  </g>
</svg>
