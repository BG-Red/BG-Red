<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#30363d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glow-red" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-blue" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.2" />
      <circle cx="28" cy="28" r="1" fill="#ff3366" fill-opacity="0.15" />
    </pattern>

    <style>
      .mono-text { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', 'Cascadia Code', monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif; }
      .badge-text { font-size: 11px; font-weight: 600; letter-spacing: 1px; }
      .title-text { font-size: 38px; font-weight: 800; letter-spacing: -0.5px; }
      .handle-text { font-size: 28px; font-weight: 700; }
      .role-text { font-size: 16px; font-weight: 500; letter-spacing: 0.5px; }
      .pill-text { font-size: 12px; font-weight: 600; }
      @keyframes pulse {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
      }
      .pulsing-dot { animation: pulse 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Container Box with Rounded Edges -->
  <rect x="2" y="2" width="916" height="296" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect x="2" y="2" width="916" height="296" rx="16" fill="url(#glow-red)" />
  <rect x="2" y="2" width="916" height="296" rx="16" fill="url(#glow-blue)" />

  <!-- Subtle Matrix/Grid Overlay -->
  <rect x="2" y="2" width="916" height="296" rx="16" fill="url(#grid-pattern)" />

  <!-- Status / Availability Chip -->
  <g transform="translate(42, 38)">
    <rect x="0" y="0" width="280" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle class="pulsing-dot" cx="14" cy="13" r="4.5" fill="#22c55e" />
    <circle cx="14" cy="13" r="2.5" fill="#ffffff" />
    <text x="28" y="17" fill="#8b949e" class="mono-text badge-text">STATUS: <tspan fill="#3fb950">OPEN TO COLLABORATION</tspan></text>
  </g>

  <!-- Main Name Header -->
  <g transform="translate(42, 115)">
    <text class="sans-text title-text" fill="#ffffff">ZACH PIERCE <tspan class="mono-text handle-text" fill="url(#accent-grad)">/ BG-Red</tspan></text>
  </g>

  <!-- Role / Headline -->
  <g transform="translate(42, 150)">
    <text class="mono-text role-text" fill="#ff4b4b">&gt; <tspan fill="#c9d1d9">Full-Stack Engineer &amp; Systems Architect</tspan></text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(42, 180)">
    <text class="sans-text" font-size="14" font-weight="400" fill="#8b949e">
      Building autonomous AI agents, sports tech SaaS, and scalable cross-platform applications.
    </text>
  </g>

  <!-- Focus Area Pills -->
  <g transform="translate(42, 222)">
    <!-- Pill 1: AI Agents -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#161b22" stroke="#ff3366" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="21" fill="#ffffff" class="mono-text pill-text">⚡ AI Agents &amp; MCP</text>
    </g>

    <!-- Pill 2: Sports Tech -->
    <g transform="translate(177, 0)">
      <rect x="0" y="0" width="170" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="21" fill="#e6edf3" class="mono-text pill-text">🏈 Sports Tech SaaS</text>
    </g>

    <!-- Pill 3: Mobile & Cross-Platform -->
    <g transform="translate(359, 0)">
      <rect x="0" y="0" width="200" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="21" fill="#e6edf3" class="mono-text pill-text">📱 React Native &amp; Flutter</text>
    </g>

    <!-- Pill 4: Cloud Systems -->
    <g transform="translate(571, 0)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="21" fill="#e6edf3" class="mono-text pill-text">☁️ Cloud &amp; DevOps</text>
    </g>
  </g>

  <!-- Right Accent Graphic (Minimalist Tech Crest) -->
  <g transform="translate(805, 55)" opacity="0.85">
    <circle cx="45" cy="45" r="42" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="45" cy="45" r="30" fill="#161b22" stroke="url(#accent-grad)" stroke-width="1.5" />
    <polygon points="45,28 58,52 32,52" fill="none" stroke="#ff3366" stroke-width="2" />
    <circle cx="45" cy="44" r="3" fill="#ffffff" />
  </g>
</svg>
